[mypy]
python_version = 3.12
strict = False
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = False
check_untyped_defs = False
pretty = True
# Gradual adoption: do not type-check the entire monorepo via import chains.
follow_imports = silent
show_error_codes = True
namespace_packages = True
explicit_package_bases = True

# Exclude non-core subdirectories (D2-004: Duplicate module named backend)
exclude = (?x)(
    ^massive-ui-ng/|
    ^frontend/|
    ^node_modules/|
    ^site/|
    ^dist/|
    ^build/|
    ^rust_core/
    )

# ── FASE 2 slice ──────────────────────────────────────────────────────
[mypy-services.*]
disallow_untyped_defs = True

[mypy-massive_core.utils.rng]
disallow_untyped_defs = True

[mypy-forecast.targets]
disallow_untyped_defs = True

# ── FASE 5 B4 slice: numerics + config + diagnostics + assimilation ───
[mypy-massive_core.numerics.*]
disallow_untyped_defs = True

[mypy-massive_core.config.*]
disallow_untyped_defs = True

[mypy-massive_core.diagnostics.*]
disallow_untyped_defs = True

[mypy-massive_core.data_assimilation.*]
disallow_untyped_defs = True

[mypy-massive_core.analysis.*]
disallow_untyped_defs = True

[mypy-massive_core.physics.*]
disallow_untyped_defs = True

[mypy-massive_core.metalearning.*]
disallow_untyped_defs = True

# Sparse engine is large / legacy-shaped; keep typed-defs policy but allow
# incomplete internal typing until a dedicated cleanup PR.
[mypy-massive_core.numerics.multilayer_engine_sparse]
disallow_untyped_defs = False
check_untyped_defs = False
