name: MASSIVE CI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    # Validate PRs regardless of target branch. Filtering pull_request to
    # [main, master] meant a PR into any other long-lived branch
    # (prod-readiness, release/*) received NO checks at all, which is how
    # the broken type gate, the unbuildable Dockerfile and the unpinned lint
    # tools went unnoticed. `push` stays restricted to the default branch.

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Core tests
        run: |
          PYTHONHASHSEED=42 python -m pytest tests/test_simulator.py tests/test_massive_engine.py \
            tests/test_multilayer.py tests/test_contracts.py tests/test_optimization.py \
            tests/test_uil_mappings.py -q --tb=line

  scientific:
    name: scientific
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Scientific tests
        run: |
          PYTHONHASHSEED=42 python -m pytest tests/test_scientific_integration.py \
            tests/test_scientific_runner.py tests/test_data_assimilation_workflow.py \
            tests/test_energy_core.py tests/test_integrated_dynamics.py -q --tb=line

  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: API smoke import
        run: |
          python -c "from api import app; print(app.title)"
          PYTHONHASHSEED=42 python -m pytest tests/test_api_security.py -q --tb=line

  full:
    name: full-suite
    runs-on: ubuntu-latest
    needs: [core, scientific, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies + coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "pytest-cov>=5.0"
      - name: Full pytest with coverage gate (fail-under 30%)
        run: |
          PYTHONHASHSEED=42 python -m pytest tests/ -q --tb=line \
            --cov=massive --cov=massive_core --cov=micro_massive --cov=services \
            --cov=backend --cov=forecast --cov=energy_engine --cov=massive_engine \
            --cov=multilayer_engine --cov=micro_engine --cov=simulator --cov=api \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=30 -q
