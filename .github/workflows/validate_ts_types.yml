name: Validate TS Types In Sync

on:
  push:
    branches: ["main", "master"]
  pull_request:
    # Validate PRs regardless of target branch. Filtering pull_request to
    # [main, master] meant a PR into any other long-lived branch
    # (prod-readiness, release/*) received NO checks at all, which is how
    # the broken type gate, the unbuildable Dockerfile and the unpinned lint
    # tools went unnoticed. `push` stays restricted to the default branch.
    paths:
      - "backend/app/models/**"
      - "frontend/src/types/api.generated.ts"
      - "scripts/gen_ts_types.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pydantic
        run: pip install "pydantic>=2.0"

      - name: Check TS types are in sync
        run: python scripts/gen_ts_types.py --check
