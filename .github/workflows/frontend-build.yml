name: Frontend Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    # Validate PRs regardless of target branch. Filtering pull_request to
    # [main, master] meant a PR into any other long-lived branch
    # (prod-readiness, release/*) received NO checks at all, which is how
    # the broken type gate, the unbuildable Dockerfile and the unpinned lint
    # tools went unnoticed. `push` stays restricted to the default branch.

permissions:
  contents: read

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --prefer-offline

      - name: Type check
        run: cd frontend && npx tsc --noEmit --strict

      - name: Build
        run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: warn
