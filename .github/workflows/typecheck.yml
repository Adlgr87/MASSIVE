name: Typecheck slice (blocking)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    # Validate PRs regardless of target branch. Filtering pull_request to
    # [main, master] meant a PR into any other long-lived branch
    # (prod-readiness, release/*) received NO checks at all, which is how
    # the broken type gate, the unbuildable Dockerfile and the unpinned lint
    # tools went unnoticed. `push` stays restricted to the default branch.

jobs:
  typecheck:
    name: mypy-slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install typecheck deps
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1.8" "numpy>=1.26" "scipy>=1.12" "pydantic>=2.0" "pyyaml>=6.0"
      - name: Run gradual type slice
        run: python scripts/typecheck_slice.py
