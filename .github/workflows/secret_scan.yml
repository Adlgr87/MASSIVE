name: Secret scan
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 3 * * 1"  # weekly full-history scan every Monday 03:00 UTC
jobs:
  # ── Incremental: fast scan of the pushed/PR commit range (push + PR) ──────────
  incremental:
    name: incremental
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      # gitleaks scans the range BASE^..HEAD. With the default fetch-depth of 1
      # the parent of the base commit is not present, so `git log` fails with
      # "ambiguous argument '<sha>^..<sha>': unknown revision" and the action
      # exits 1 without scanning anything (~0 bytes scanned). Full history makes
      # the incremental range resolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Full-history: exhaustive scan of the entire repository (scheduled) ──────
  full-history:
    name: full-history
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
