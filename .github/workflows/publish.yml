name: Build & Publish

on:
  push:
    branches: ["main"]
  release:
    types: ["published"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # --- 1. Lint (must pass before anything else) -------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  # --- 2. Tests (must pass before publish) ------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONHASHSEED: "42"
        run: |
          python -m pytest tests/ -q --tb=short

  # --- 3. Frontend build (must succeed) ---------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --prefer-offline
      - run: cd frontend && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # --- 4. Benchmark (must pass for publish) ---------------------------------
  benchmark:
    name: Benchmark (offline)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline benchmark
        env:
          PYTHONHASHSEED: "42"
        run: |
          python -m benchmarks.runner --cases datasets/pvu_cases --offline \
            --out reports/validation/ci --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/validation/ci

  # --- 5. Doc build (must succeed) --------------------------------------------
  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (dry run — fail on error)
        run: mkdocs build --clean

  # --- 6. Build Python artifacts (sdist + wheel) ------------------------------
  build-wheels:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: [lint, test, benchmark, docs]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  # --- 7. Build Docker image --------------------------------------------------
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-build, benchmark, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/massive
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.11

      - name: Run Docker smoke test
        run: |
          mkdir -p .env-test
          echo "MASSIVE_API_KEY=ci-test-key" > .env-test/.env
          touch .env-test/.env.local
          docker run --rm \
            -e MASSIVE_API_KEY=ci-test-key \
            -e MASSIVE_ENV=development \
            ghcr.io/${{ github.repository_owner }}/massive:latest \
            curl -f http://127.0.0.1:8000/health

      - name: Upload Docker image digest
        run: echo "image=ghcr.io/${{ github.repository_owner }}/massive:${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT

  # --- 8. Publish to PyPI (on release or tag) -------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi-publish
      url: https://pypi.org/project/massive
    steps:
      - uses: actions/checkout@v4
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # --- 9. Publish Docker image (on release or tag) --------------------------
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/massive
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 10. Publish (always build image on main, no push) --------------------
  build-only-main:
    name: Build on Main (no publish)
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-build, benchmark, docs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/massive
          tags: type=sha,format=long
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
