name: Lint & Type Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run ruff
        run: ruff check .

      - name: Run black (check)
        run: black --check .

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      # NOTE: this step used to run `mypy --config-file mypy.ini`, but mypy.ini
      # was removed when [tool.mypy] moved into pyproject.toml. mypy exits 2 with
      # "Cannot find config file", so the whole Lint & Type Check job failed on
      # every run and the advertised type gate was inert. The type check now
      # delegates to the single working gate (same script typecheck.yml runs), so
      # there is one authoritative definition of "the type slice".
      - name: Run mypy (delegates to the typecheck slice)
        run: |
          PYTHONHASHSEED=42 python scripts/typecheck_slice.py

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Run ESLint
        run: cd frontend && npm run lint

      - name: Run TypeScript check
        run: cd frontend && npx tsc --noEmit
