services:
  massive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massive-uil
    restart: unless-stopped
    ports:
      - "8000:8000"  # API
      - "8501:8501"  # Streamlit
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./.env:/app/.env:ro
      - massive-logs:/app/reports/validation/ci
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - massive-net

  # ── Next-Gen UI (production): API + compiled React frontend ─────────────
  ui-ng:
    build:
      context: .
      dockerfile: Dockerfile.ui-ng
    container_name: massive-ui-ng
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - massive-ui-ng-data:/data
    env_file:
      - .env
    environment:
      - MASSIVE_SERVE_FRONTEND=1
      - MASSIVE_DATA_DIR=/data
      - MASSIVE_ENV=production
      # Security (uncomment/override in .env):
      # - MASSIVE_API_KEYS=change-me-strong-key
      # - MASSIVE_ALLOWED_HOSTS=massive.example.com
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - massive-net

volumes:
  massive-logs:
  massive-ui-ng-data:

networks:
  massive-net:
    driver: bridge
