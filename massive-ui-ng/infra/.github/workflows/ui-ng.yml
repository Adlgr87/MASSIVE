name: MASSIVE UI-NG CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/app/**"
      - "frontend/**"
      - "tests/test_ui_ng.py"
      - "scripts/gen_ts_types.py"
      - "requirements.txt"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "backend/app/**"
      - "frontend/**"
      - "tests/test_ui_ng.py"
      - "scripts/gen_ts_types.py"
      - "requirements.txt"

jobs:
  backend:
    name: backend (tests + translator eval + contract sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: UI-NG backend tests (REST + live WebSocket + metrics)
        run: |
          PYTHONHASHSEED=42 python -m pytest tests/test_ui_ng.py tests/test_ui_ng_live.py -q --tb=line
      - name: Translator golden-set evaluation (heuristic)
        run: |
          python -m backend.app.evaluation
      - name: TypeScript contract sync check
        run: |
          python scripts/gen_ts_types.py
          git diff --exit-code frontend/src/types/api.generated.ts

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
