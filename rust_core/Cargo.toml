[package]
name = "massive-rust-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "massive_rust_core"
crate-type = ["cdylib", "rlib"]
# Paths in Cargo.toml resolve relative to the manifest's own directory
# (`rust_core/`), so "rust_core/src/lib.rs" pointed at
# `rust_core/rust_core/src/lib.rs`, which does not exist — `cargo build`
# failed before compiling a single line.
path = "src/lib.rs"

[dependencies]
ndarray = "0.17"
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
