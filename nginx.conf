# =============================================================================
# nginx.conf — runtime config for the MASSIVE container
#
# Serves the built SPA from /usr/share/nginx/html and reverse-proxies the API to
# uvicorn on 127.0.0.1:8000.
#
# This file was MISSING from the repository while Dockerfile:61 did
# `COPY nginx.conf /etc/nginx/nginx.conf`, so the Docker image could not be built
# at all and the "Docker E2E Health" workflow failed on every run ("failed to
# compute cache key ... not found"). It is written for the constraints the
# Dockerfile actually enforces:
#
#   * nginx runs as the non-root `appuser` (Dockerfile: `USER appuser` plus
#     `setcap cap_net_bind_service=+ep` so :80 can still be bound);
#   * therefore no `user` directive, and every temp/pid path must be writable by
#     that user — hence /tmp below.
# =============================================================================

worker_processes auto;

# Non-root: the master process cannot write to /run or /var/run.
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    # Non-root: all temp paths must live in a writable location.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Compression for the SPA bundle.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream massive_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Don't leak the nginx version.
        server_tokens off;

        # ── API reverse proxy ────────────────────────────────────────────────
        # Mirrors the canonical (/v1, /api/v1) and operational prefixes the
        # FastAPI app actually mounts: routers are included under both /v1 and
        # /api/v1 in backend/app/main.py.
        location ~ ^/(v1|api/v1)/ {
            proxy_pass         http://massive_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # The API carries API keys in headers; never let nginx drop them.
            proxy_pass_request_headers on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # Simulations can be long; do not buffer SSE-style responses.
            proxy_buffering off;
        }

        # ── Operational endpoints ────────────────────────────────────────────
        location = /health {
            proxy_pass http://massive_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /ready {
            proxy_pass http://massive_api/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /metrics {
            proxy_pass http://massive_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # /metrics requires an API key; keep it off the access log too.
            access_log off;
        }

        location = /version {
            proxy_pass http://massive_api/version;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi/v1.json {
            proxy_pass http://massive_api/openapi/v1.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Interactive API docs (only served when the API runs in dev mode).
        location /docs {
            proxy_pass http://massive_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://massive_api/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://massive_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Static assets ────────────────────────────────────────────────────
        # Vite emits content-hashed filenames, so they can be cached hard.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        # index.html must never be cached: it points at the current hashes.
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
