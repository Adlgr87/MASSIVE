[supervisord]
nodaemon=true

# nginx needs to bind :80 — the Dockerfile grants cap_net_bind_service
# so nginx runs as appuser (non-root) and can still bind privileged ports.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=/usr/local/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

