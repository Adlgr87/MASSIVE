# -----------------------------------------------------------------------------
# (d) DeGroot W_ij — asymmetric weight matrix from authority metrics
#     W_ij ∝ A_ij · (authority_j)^alpha, row-stochastic.
#     Authority from A2 in-degree & retweet influence. DeGroot (1974).
# -----------------------------------------------------------------------------
degroot:
  authority_exponent:
    value: 0.7
    sem: 0.10
    source_dataset: "A2"
    estimation_method: "maximum_likelihood"
    empirical_reference: "DeGroot (1974); Cha et al. (2010); Weng et al. (2013)"
  self_weight:
    value: 0.1
    sem: 0.02
    source_dataset: "A2"
    estimation_method: "method_of_moments"
    empirical_reference: "DeGroot (1974); Jackson (2008)"
  authority_source: "In-degree + retweet-based influence (Watts-Strogatz social / Barabási-Albert digital)"
