          estimation_method: "least_squares_fit"
          empirical_reference: "Hegselmann & Krause (2002)"
        medium_edu:
          value: 0.27
          sem: 0.03
          source_dataset: "A2"
          estimation_method: "least_squares_fit"
          empirical_reference: "Hegselmann & Krause (2002)"
        high_edu:
