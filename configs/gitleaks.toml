# Gitleaks configuration for MASSIVE.
#
# Extends the upstream default ruleset with explicit, documented exceptions.
# NOTHING in this file may ever be a real credential. If you are tempted to
# add a real key here, you are doing it wrong: real keys live in environment
# variables (see docs/security/secrets-and-configuration.md).

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# NOTE: the former EXCEPTION 1 (SEC-01 historical Zapier token) was removed
# on 2026-08-22 after the token was revoked by the owner and the secret was
# purged from the public git history via `git filter-repo` (fresh-clone scan
# verified clean). See docs/security/threat-model.md.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# EXCEPTION 2 — non-secret fixture values used by tests/docs/examples.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "MASSIVE non-secret fixture values (documented dev fallback key, test keys, .env.example placeholders)"
stopwords = [
  # Documented development fallback (backend/app/security.py, api.py, README, docs)
  "dev-secret-key",
  # Historical insecure fallback removed from HEAD but present in git history
  # (pre-2026-08 commits; superseded by fail-closed auth — see audit SEC-02)
  "default-secret-key",
  "replace_with_generated_key",
  # Test fixture keys (tests/test_api_security.py, tests/test_llm_endpoint.py)
  "testkey111",
  "badkey00",
  "fake-llm-key",
  "live-secret",
  "secret-123",
  # .env.example placeholders
  "change-me-in-production",
  "ci-test-key",
  "your_groq_api_key_here",
  "your_openai_api_key_here",
  "your_openrouter_api_key_here",
  "your_twitter_bearer_token_here",
  "your_reddit_client_id_here",
  "your_reddit_client_secret_here",
]
