[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massive"
version = "1.0.0"
description = "MASSIVE simulation toolkit with optional Rust acceleration"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MASSIVE Research" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "networkx>=3.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31",
  "pgmpy>=1.1.0",
  "nashpy>=0.0.43",
  "dask>=2024.0.0",
  "torch>=2.2",
]

[project.optional-dependencies]
core = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "networkx>=3.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.6", "plotly>=5.18.0", "httpx>=0.27.0"]
# Frontend (Vite/React) lives in frontend/ and is built separately.
# The backend serves it as static files via Starlette StaticFiles.
# Streamlit (legacy UIL demo flow) was removed — see OPS-02.
llm = ["openai>=1.14", "langchain>=1.2.0", "langchain-openai>=1.2.0", "langchain-groq>=1.1.0"]
ml = ["scikit-learn>=1.4"]
scientific = ["statsmodels>=0.14", "scikit-learn>=1.4", "psutil>=5.9.0"]
docs = ["mkdocs>=1.5.3", "mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.24.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0", "mypy>=1.8", "ruff==0.16.3", "black==24.10.0", "build>=1.2"]
gpu = ["cupy>=13.0"]
tda = ["ripser>=0.6", "persim>=0.3"]
clustering = ["hdbscan>=0.8"]
social = ["tweepy>=4.16.0", "praw>=7.8.1"]
full = [
  "massive[core,api,llm,ml,scientific,gpu,tda,clustering,social,docs,dev]",
]

[project.scripts]
massive-cli = "massive.cli.main:main"

[project.urls]
Homepage = "https://github.com/Adlgr87/MASSIVE"
Documentation = "https://adlgr87.github.io/MASSIVE/"
Repository = "https://github.com/Adlgr87/MASSIVE"
Issues = "https://github.com/Adlgr87/MASSIVE/issues"

# The Rust extension (massive_rust_core) is built separately via maturin
# in the dedicated CI job (rust.yml) — see W3-T02. It is intentionally NOT
# part of this setuptools wheel so `pip install -e .` works without a Rust
# toolchain.

[tool.setuptools.packages.find]
where = ["."]
include = [
  "massive*", "backend*", "services*", "benchmarks*", "micro_massive*",
  "forecast*", "massive_core*", "metrics*", "adapters*", "monitoring*",
]

# The legacy root-level .py modules are distributed
# as top-level py-modules so the wheel imports them without a package dir.
[tool.setuptools]
py-modules = [
  "api", "benchmark_scalability", "brexit_calibration", "cache_manager",
  "cfc_engine", "cfc_router", "cfc_trainer", "document_intelligence",
  "energy_engine", "energy_runner", "energy_schemas", "interpreter_layer",
  "langchain_workflows", "massive_engine",
  "micro_engine", "micro_schemas", "multilayer_engine",
  "programmatic_architect", "simulator",
  "social_architect", "social_connectors",
  "uil_adapter", "visualizations",
]

[tool.setuptools.package-data]
massive_core = ["config/defaults.yaml"]
metrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["massive", "massive_core", "micro_massive", "services", "backend",
          "forecast", "energy_engine", "massive_engine", "multilayer_engine",
          "micro_engine", "simulator", "api"]
branch = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*",
]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv", "venv", "node_modules", "build", "dist",
  "__pycache__", ".mypy_cache", ".pytest_cache",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # handled by line-length + black
[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv|venv|node_modules|build|dist
    |__pycache__|\.mypy_cache|\.pytest_cache
    |frontend/node_modules
)/
'''

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = false
pretty = true
follow_imports = "silent"
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = [
    "frontend/",
    "frontend/node_modules/",
    "node_modules/",
    "site/",
    "dist/",
    "build/",
]

# ── FASE 2 slice ──────────────────────────────────────────────────────
[[tool.mypy.overrides]]
module = "services.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.utils.rng"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "forecast.targets"
disallow_untyped_defs = true

# ── FASE 5 B4 slice: numerics + config + diagnostics + assimilation ───
[[tool.mypy.overrides]]
module = "massive_core.numerics.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.config.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.diagnostics.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.data_assimilation.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.analysis.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.physics.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "massive_core.metalearning.*"
disallow_untyped_defs = true

# Sparse engine is large / legacy-shaped; keep typed-defs policy but allow
# incomplete internal typing until a dedicated cleanup PR.
# multilayer_engine_sparse opt-out — related issue: #42 (D9-004)
[[tool.mypy.overrides]]
module = "massive_core.numerics.multilayer_engine_sparse"
disallow_untyped_defs = false
check_untyped_defs = false
