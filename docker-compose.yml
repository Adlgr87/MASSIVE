# =============================================================================
# docker-compose.yml — CANONICAL multi-service deployment
# Uses the multi-stage `Dockerfile` (builder-py + builder-fe + runtime).
# Runs supervisord as non-root: uvicorn (FastAPI :8000) + nginx (:80, SPA +
# reverse proxy). See README.md "Prefer Docker?" section for usage.
# =============================================================================

services:
  massive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massive-uil
    restart: unless-stopped
    ports:
      - "80:80"       # Frontend + API gateway (nginx)
      - "8000:8000"   # API (direct, optional)
    volumes:
      - ./.env:/app/.env:ro
      - massive-logs:/app/reports/validation/ci
    # Belt and braces: the app itself loads /app/.env via
    # massive_core.config.env.load_env_file(), and Compose also injects the
    # same file so the variables are visible to anything that bypasses the
    # Python loader (healthchecks, shell entrypoints, `docker compose exec`).
    env_file:
      - .env
    environment:
      - MASSIVE_ENV=${MASSIVE_ENV:-development}
    networks:
      - massive-net

volumes:
  massive-logs:

networks:
  massive-net:
    driver: bridge
