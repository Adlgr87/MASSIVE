services:
  massive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massive-uil
    restart: unless-stopped
    ports:
      - "8000:8000"  # UI-NG Frontend + API (single-service)
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./.env:/app/.env:ro
      - massive-logs:/app/reports/validation/ci
    environment:
      - MASSIVE_SERVE_FRONTEND=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - massive-net

volumes:
  massive-logs:

networks:
  massive-net:
    driver: bridge
