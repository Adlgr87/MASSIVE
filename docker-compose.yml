# =============================================================================
# docker-compose.yml — CANONICAL multi-service deployment
# Uses the multi-stage `Dockerfile` (builder-py + builder-fe + runtime).
# Runs supervisord as non-root: uvicorn (FastAPI :8000) + nginx (:80, SPA +
# reverse proxy). See README.md "Prefer Docker?" section for usage.
# =============================================================================

services:
  massive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massive-uil
    restart: unless-stopped
    ports:
      - "80:80"       # Frontend + API gateway (nginx)
      - "8000:8000"   # API (direct, optional)
    volumes:
      # NOTE: `./.env` is deliberately NOT bind-mounted. Docker creates a
      # DIRECTORY at the source path when it does not exist, so a first-time
      # `docker compose up` without a .env silently produced a directory
      # named `.env`, which then shadowed the real file forever. `env_file`
      # below already injects the same variables into the process.
      - massive-logs:/app/reports/validation/ci
    env_file:
      # Optional so a clean checkout can `docker compose up` without first
      # creating a .env (Compose errors out on a missing *required* env_file).
      # Requires Compose v2.24+; see docs for the `required` field.
      - path: .env
        required: false
    environment:
      - MASSIVE_ENV=${MASSIVE_ENV:-development}
      # Host allow-list. The API fails CLOSED: outside a development
      # environment an unset allow-list rejects every request with 400.
      # nginx forwards the client's Host header verbatim
      # (`proxy_set_header Host $host`), and the HEALTHCHECK curls
      # 127.0.0.1 — so without these entries the container would be marked
      # unhealthy and restart forever. Override with your real public
      # hostname(s) in .env when deploying.
      - MASSIVE_ALLOWED_HOSTS=${MASSIVE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    networks:
      - massive-net

volumes:
  massive-logs:

networks:
  massive-net:
    driver: bridge
