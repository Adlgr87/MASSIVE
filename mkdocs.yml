site_name: MASSIVE Documentation
site_description: MASSIVE — Hybrid social dynamics simulator. Numerical core + LLM as regime selector.
theme:
  name: material
  palette:
    scheme: slate
    primary: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

nav:
  - Home: index.md
  - API Reference: api.md
  - Spanish Version: README_ES.md
  - Production Readiness:
      - Audit & Risk Matrix: production-readiness-audit.md
      - Release Checklist: release-checklist.md
      - Architecture (current): architecture/current-state.md
      - Architecture (target): architecture/target-state.md
      - Runbooks:
          - Local Development: runbooks/local-development.md
          - Operations: runbooks/operations.md
          - Incidents: runbooks/incidents.md
      - Security:
          - Threat Model: security/threat-model.md
          - Secrets & Configuration: security/secrets-and-configuration.md
      - Testing Strategy: testing/test-strategy.md
      - Performance Baseline: performance/baseline.md
  - Factbook Integration:
      - Summary: FACTBOOK_SUMMARY.md
      - Quickstart: FACTBOOK_QUICKSTART.md
      - Integration Plan: FACTBOOK_INTEGRATION_PLAN.md
      - Integration Complete: FACTBOOK_INTEGRATION_COMPLETE.md
  - Validation (PVU-BS):
      - Overview: validation/README.md
      - Protocol (EN): validation/PVU_MASSIVE_EN.md
      - Protocolo (ES): validation/PVU_MASSIVE_ES.md
      - Pre-registration (EN): validation/preregistration_template_EN.md
      - Pre-registro (ES): validation/preregistration_template_ES.md
      - Report template (EN): validation/validation_report_template_EN.md
      - Plantilla de reporte (ES): validation/validation_report_template_ES.md
