[supervisord]
nodaemon=true
user=root

# nginx must run as root to bind :80 (non-root cannot bind <1024 without
# cap_net_bind_service, which the Dockerfile grants explicitly).
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=/usr/local/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# FIX (CRIT-2): Streamlit UI removed (OPS-02). No /ui/ program — micro_massive
# and all engines are accessed via the v1 API directly.
