; =============================================================================
; supervisord.conf — process supervision for the MASSIVE container
;
; Runs two programs under one container:
;   uvicorn  — FastAPI app on 127.0.0.1:8000 (loopback only; nginx is the gateway)
;   nginx    — SPA + reverse proxy on :80
;
; This file was MISSING from the repository while Dockerfile:62 did
; `COPY supervisord.conf /etc/supervisor/conf.d/supervisord.conf`, so the Docker
; image could not be built and the "Docker E2E Health" workflow failed on every
; run. Note the Dockerfile ends with `USER appuser`, so supervisord starts
; *already* non-root: there is deliberately no `user=` directive here, because
; supervisord can only drop privileges from root, not switch between unprivileged
; users. All runtime paths therefore live in /tmp or /var/log/nginx, which the
; Dockerfile chowns to appuser.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── API (uvicorn) ────────────────────────────────────────────────────────────
; Bound to loopback: nginx is the only public entry point, so the API is not
; reachable directly even though docker-compose publishes 8000 (that mapping is
; optional and does not bypass the proxy for /v1 traffic).
[program:uvicorn]
command=uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── Frontend + gateway (nginx) ───────────────────────────────────────────────
; `daemon off` keeps nginx in the foreground so supervisord can supervise it.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; No [eventlistener] section on purpose: supervisord event listeners must
; implement the listener protocol on stdin (READY / RESULT), so a plain
; `supervisorctl status` would block the event loop. Process failures are
; already visible via stderr, which supervisord forwards to the container log.
